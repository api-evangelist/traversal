name: Traversal
description: >-
  Traversal is an AI SRE (Site Reliability Engineering) platform that
  autonomously triages alerts, performs root-cause analysis, and helps prevent
  production incidents across an enterprise's entire observability stack. Founded
  in 2023 by AI researchers from MIT, Columbia, Berkeley, and Cornell and based
  in New York City, Traversal created the "AI SRE" category using causal machine
  learning and agentic AI. Its V1 Sessions API and hosted MCP server let teams
  launch investigations programmatically and from AI clients (Claude, Cursor,
  and others). Backed by Sequoia and Kleiner Perkins (~$53M raised).
