  - date: '2026-07-20'
    tags: [API, Investigations]
    title: Choose investigation depth over the Sessions API
    breaking: false
    additions: true
    highlights:
      - >-
        Sessions API now accepts an optional `thinking_mode` (auto | deep |
        fast) on both session creation and follow-ups; existing integrations
        need no changes.
      - >-
        Follow-ups now count toward the same per-organization concurrency limit
        as new sessions, so a burst of follow-ups is throttled with a 429.
  - date: '2026-07-20'
    tags: [Web app, Analytics]
    title: Revamped Analytics page
    breaking: false
    additions: true
    highlights:
      - >-
        New Org-Admin Analytics page (app.traversal.com/analytics) with usage
        over time, top users/channels, and session breakdowns by origin (Web,
        Slack, API, MCP).
  - date: '2026-07-13'
    tags: [Workers, Slack, Investigations]
    title: Workers read live incident transcripts
    breaking: false
    additions: true
    highlights:
      - >-
        Workers can read a live incident call's transcript in real time (private
        beta) and fold it into an investigation.
  - date: '2026-07-11'
    tags: [Web app, UX/UI]
